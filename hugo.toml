baseURL = 'https://doda.co/'
languageCode = 'en-us'
title = 'Dominik Dabrowski'
theme = 'PaperMod'

# Google analytics code
googleAnalytics = "G-xxxxxxxxx"

[taxonomies]
tag = 'tags'

[params]
description = "A Tech Blog"
author = "Dominik Dabrowski"
defaultTheme = "auto"
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = false
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = false
TocOpen = false

  [params.profileMode]
  enabled = true
  title = "Hi!"
  subtitle = """
I work on Systems at [Substack](https://substack.com). I'm excited about all things infra, AI and running things at scale.

I grew up in Austria, and lived in a few cities in Europe (London, Berlin, Barcelona) before finally settling in the US in 2019.

In my free time I enjoy meditation, jhanas, lifting and painting.

I'm usually at the Thursday sits at the [Berkeley Alembic](https://www.berkeleyalembic.org/). If our paths cross, don't hesitate to reach out!
"""
  imageUrl = "/images/profile.jpg"
  imageWidth = 120
  imageHeight = 120

    [[params.profileMode.buttons]]
    name = "Writing"
    url = "/writing"

  [[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/dominik-dario/"

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/doda"

  [[params.socialIcons]]
  name = "instagram"
  url = "https://instagram.com/dominik_dario"

[[menu.main]]
identifier = "writing"
name = "Writing"
url = "/writing/"
weight = 10

# Syntax highlight on code blocks
[markup]
[markup.highlight]
noClasses = false
guessSyntax = true
lineNos = false
style = 'monokai'
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
